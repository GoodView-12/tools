<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>猫与音响：第 N 层循环</title>
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden;height:100%;width:100%;}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;background:#000;touch-action:none;cursor:default;object-fit:cover;}
  #hint{position:absolute;top:10px;left:0;right:0;text-align:center;color:#ccc;font:13px/1.5 system-ui,sans-serif;pointer-events:none;z-index:10;}

  #ui{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:20px 30px 40px;pointer-events:none;z-index:10;}
  .pad{display:flex;gap:20px;pointer-events:auto;}
  .btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;backdrop-filter:blur(4px);}
  .btn:active{background:rgba(255,255,255,.3);transform:scale(0.95);}
  #joystick{position:relative;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);pointer-events:auto;touch-action:none;backdrop-filter:blur(4px);}
  #joystick .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);transform:translate(-50%,-50%);transition:transform .06s linear;will-change:transform;}

  #desktopBar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:none;justify-content:space-between;align-items:center;color:#ccc;font:13px/1.4 system-ui,sans-serif;pointer-events:none;z-index:10;}
  #desktopBar .keys{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  #desktopBar kbd{display:inline-block;min-width:22px;padding:2px 6px;border:1px solid #666;border-bottom-width:2px;border-radius:4px;background:#222;color:#eee;font:12px/1.2 ui-monospace,monospace;text-align:center;}
  #desktopBar .actions{pointer-events:auto;display:flex;gap:10px;}
  #desktopBar button{background:#222;color:#ddd;border:1px solid #555;border-radius:6px;padding:6px 14px;font:13px system-ui;cursor:pointer;}
  #desktopBar button:hover{background:#333;border-color:#888;}

  #modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center;
    flex-direction: column; color: #fff; font-family: system-ui;
    z-index: 100;
  }
  #modal h2 { font-size: 32px; margin-bottom: 10px; color: #ff4a4a; }
  #modal p { font-size: 18px; margin: 5px 0; color: #ccc; }
  #modal button {
    margin-top: 30px; padding: 10px 30px; font-size: 18px;
    background: #333; color: #fff; border: 2px solid #777; border-radius: 8px;
    cursor: pointer; transition: background 0.2s;
  }
  #modal button:hover { background: #555; }
  #modal .modal-actions { display: flex; gap: 14px; margin-top: 30px; }
  #modal .modal-actions button { margin-top: 0; }

  #jumpscare {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: transparent; display: none; justify-content: center; align-items: center;
    z-index: 200; pointer-events: none;
  }
  #jumpscare img {
    max-width: 80%; max-height: 80%; object-fit: contain;
    animation: shake 0.15s infinite alternate;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    border: 4px solid #fff;
    background: #fff;
  }
  @keyframes shake {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(8px, -8px) scale(1.05); }
  }

  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
    flex-direction: column; color: #fff; font-family: system-ui;
    z-index: 300; transition: opacity 0.5s;
  }
  #startScreen h2 { font-size: 32px; margin-bottom: 10px; color: #ff4a4a; }
  #startScreen p { font-size: 18px; margin: 5px 0; color: #ccc; text-align: center; padding: 0 20px; }
  #startBtn {
    margin-top: 30px; padding: 10px 30px; font-size: 18px;
    background: #333; color: #fff; border: 2px solid #777; border-radius: 8px;
    cursor: pointer; transition: background 0.2s;
  }
  #startBtn:hover { background: #555; }
</style>
</head>
<body>
<div id="wrap">
  <div id="startScreen">
    <h2>第 N 层循环</h2>
    <p>一只猫，与无穷无尽的音响。</p>
    <p id="start-best">历史最高：第 1 层</p>
    <p id="start-assets">总资产：0</p>
    <button id="startBtn">开始循环</button>
  </div>

  <canvas id="game"></canvas>
  <div id="hint">← → 移动 ｜ ↑/空格 跳 ｜ 目标：本层望景位</div>

  <div id="ui">
    <div id="joystick">
      <div class="knob" id="joystickKnob"></div>
    </div>
    <div class="pad">
      <div class="btn" id="btnJump">↑</div>
    </div>
  </div>

  <div id="desktopBar">
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd> 移动</span>
      <span><kbd>↑</kbd>/<kbd>空格</kbd> 跳</span>
      <span><kbd>P</kbd> 暂停</span>
      <span><kbd>R</kbd> 重开</span>
    </div>
    <div class="actions">
      <button id="btnRestart">重开</button>
      <button id="btnPause">暂停</button>
    </div>
  </div>

  <div id="modal">
    <h2>SAN 值崩溃</h2>
    <p id="modal-layer">你在第 1 层循环失去了理智</p>
    <p id="modal-best">历史最高：第 1 层</p>
    <p id="modal-coins">拾取的钱：0</p>
    <div class="modal-actions">
      <button id="btnModalRestart">重新开始</button>
      <button id="btnModalHome">返回首页</button>
    </div>
  </div>

  <div id="jumpscare">
    <img id="jumpscareImg" style="display:none;" src="" alt="surprise">
    <canvas id="jumpscareCanvas" width="400" height="400" style="display:none; max-width:80%; max-height:80%; background:#fff; border:4px solid #fff; border-radius:8px; box-shadow: 0 0 50px rgba(0,0,0,0.8); animation: shake 0.15s infinite alternate;"></canvas>
  </div>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  
  const DESIGN_W = 960;
  const DESIGN_H = 540;
  
  let logicalW = DESIGN_W;
  let logicalH = DESIGN_H;
  let scale = 1;

  function resize() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    
    const targetRatio = winW / winH;
    logicalW = DESIGN_W;
    logicalH = DESIGN_W / targetRatio;

    if (logicalH < 540) logicalH = 540;
    if (logicalH > 1400) logicalH = 1400;

    scale = winW / logicalW;
    
    const dpr = window.devicePixelRatio || 1;
    canvas.width = winW * dpr;
    canvas.height = winH * dpr;
    canvas.style.width = winW + 'px';
    canvas.style.height = winH + 'px';
    
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.scale(scale, scale);
  }
  
  window.addEventListener('resize', resize);
  
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // 音效参数表：wave 波形、f1/f2 频率渐变、dur 时长、g1/g2 增益渐变
  // notes 为离散音符（如 coin 的两步音），存在时优先于 f1/f2 渐变
  const SOUND_SPECS = {
    jump:      { wave:'sine',     f1:300,  f2:600,  dur:0.1, g1:0.1,  g2:0.01 },
    coin:      { wave:'triangle', notes:[[880, 0], [1046.5, 0.1]], dur:0.3, g1:0.15, g2:0.01 },
    hurt:      { wave:'sawtooth', f1:150,  f2:50,   dur:0.2, g1:0.2,  g2:0.01 },
    stamp:     { wave:'square',   f1:100,  f2:30,   dur:0.3, g1:0.3,  g2:0.01 },
    jumpscare: { wave:'sawtooth', f1:1000, f2:200,  dur:0.5, g1:0.3,  g2:0.01 },
  };

  function playSound(type) {
    if (!audioCtx) return;
    const spec = SOUND_SPECS[type];
    if (!spec) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = spec.wave;
    const t = audioCtx.currentTime;
    if (spec.notes) {
      for (const [f, at] of spec.notes) osc.frequency.setValueAtTime(f, t + at);
    } else {
      osc.frequency.setValueAtTime(spec.f1, t);
      osc.frequency.exponentialRampToValueAtTime(spec.f2, t + spec.dur);
    }
    gain.gain.setValueAtTime(spec.g1, t);
    gain.gain.exponentialRampToValueAtTime(spec.g2, t + spec.dur);
    osc.start(t); osc.stop(t + spec.dur);
  }

  const CONFIG = {
    W: DESIGN_W, H: DESIGN_H,
    catW: 64, catH: 64,
    catSpeed: 240, 
    jumpVel: -620, gravity: 1800,
    baseWorldW: 1400, worldWInc: 300,
    sanMax: 100, sanDamage: 38, 
    sanRecover: 7, 
    startX: 40,
    coverH: 80, stoneW: 76, stoneH: 64, wallW: 56, wallH: 64,
    bulletSpeed: 380, 
    bulletRadius: 12, bulletExplodeDamage: 30, 
    stonePulsePeriod: 2.0, stonePulseDuration: 1.0,
    stampDamage: 40, stampWarnTime: 0.6,
    shakeDecay: 8,
  };

  const images = {};
  function loadImg(key, url) {
    if (!url) { images[key] = null; return; }
    const img = new Image();
    img.onload = () => { images[key] = img; };
    img.onerror = () => { images[key] = null; };
    img.src = url;
  }
  
  loadImg('cat', 'images/cat.png');
  loadImg('coin', 'images/coin.png');

  const jumpscareImgEl = document.getElementById('jumpscareImg');
  const jumpscareCanvasEl = document.getElementById('jumpscareCanvas');
  jumpscareImgEl.onload = () => { jumpscareImgEl.style.display = 'block'; jumpscareCanvasEl.style.display = 'none'; };
  jumpscareImgEl.onerror = () => { jumpscareImgEl.style.display = 'none'; jumpscareCanvasEl.style.display = 'block'; drawFallbackJumpscare(); };
  jumpscareImgEl.src = 'jumpscare.jpg';

  function drawFallbackJumpscare() {
    const c = jumpscareCanvasEl, cctx = c.getContext('2d');
    cctx.fillStyle = '#fff'; cctx.fillRect(0, 0, c.width, c.height);
    cctx.fillStyle = '#000'; cctx.beginPath(); cctx.arc(200, 200, 150, 0, Math.PI*2); cctx.fill();
    cctx.fillStyle = '#fff'; cctx.beginPath(); cctx.arc(130, 160, 45, 0, Math.PI*2); cctx.fill(); cctx.beginPath(); cctx.arc(270, 160, 45, 0, Math.PI*2); cctx.fill();
    cctx.fillStyle = '#000'; cctx.beginPath(); cctx.arc(130, 160, 10, 0, Math.PI*2); cctx.fill(); cctx.beginPath(); cctx.arc(270, 160, 10, 0, Math.PI*2); cctx.fill();
    cctx.fillStyle = '#cc3333'; cctx.beginPath(); cctx.moveTo(100, 280); cctx.quadraticCurveTo(200, 380, 300, 280); cctx.quadraticCurveTo(200, 320, 100, 280); cctx.fill();
    cctx.strokeStyle = '#fff'; cctx.lineWidth = 6; cctx.beginPath(); cctx.moveTo(100, 140); cctx.lineTo(160, 140); cctx.stroke(); cctx.beginPath(); cctx.moveTo(240, 140); cctx.lineTo(300, 140); cctx.stroke();
  }

  const uiTouch = document.getElementById('ui');
  const uiDesktop = document.getElementById('desktopBar');
  const hintEl = document.getElementById('hint');
  let currentMode = null;

  function setMode(mode) {
    if (mode === currentMode) return;
    currentMode = mode;
    if (mode === 'touch') {
      uiTouch.style.display = 'flex'; uiDesktop.style.display = 'none';
      hintEl.textContent = '摇杆移动 ｜ 点击 ↑ 跳跃 ｜ 目标：本层望景位';
    } else {
      uiTouch.style.display = 'none'; uiDesktop.style.display = 'flex';
      hintEl.textContent = '← → 移动 ｜ ↑/空格 跳 ｜ 目标：本层望景位';
    }
    resize();
  }
  setMode(window.matchMedia && window.matchMedia('(pointer:coarse)').matches ? 'touch' : 'desktop');

  window.addEventListener('keydown', e => {
    if (['Shift','Control','Alt','Meta'].includes(e.key)) return;
    setMode('desktop');
  }, true);
  window.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') setMode('touch');
    else if (e.pointerType === 'mouse') setMode('desktop');
  }, true);

  const keys = { left:false, right:false, jump:false };
  const keyMap = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'jump', ' ':'jump', a:'left', d:'right', w:'jump' };
  let paused = false;

  window.addEventListener('keydown', e => {
    // 首页或失败弹窗时，快捷键不作用于游戏
    if (state === 'waiting' || state === 'gameover') return;
    const k = keyMap[e.key];
    if (k === 'jump') { e.preventDefault(); if (!e.repeat) doJump(); return; } // 跳跃单击
    if (k) { keys[k] = true; e.preventDefault(); }
    if (e.key === 'r' || e.key === 'R') resetGame();
    if (e.key === 'p' || e.key === 'P') paused = !paused;
  });
  window.addEventListener('keyup', e => {
    const k = keyMap[e.key];
    if (k) { keys[k] = false; e.preventDefault(); }
  });

  // ===================== 移动端控件：虚拟摇杆 + 跳跃单击 =====================
  const joystickEl = document.getElementById('joystick');
  const joystickKnobEl = document.getElementById('joystickKnob');
  const JOY_DEAD = 0.3; // 摇杆死区比例
  let joyPointerId = null;

  function moveJoystick(clientX, clientY) {
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const maxR = rect.width / 2 - joystickKnobEl.offsetWidth / 2;
    const dx = clientX - cx, dy = clientY - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const clamped = Math.min(dist, maxR);
    const kx = (dx / dist) * clamped, ky = (dy / dist) * clamped;
    joystickKnobEl.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
    const nx = kx / maxR;
    keys.left = nx < -JOY_DEAD;
    keys.right = nx > JOY_DEAD;
  }

  function resetJoystick() {
    joyPointerId = null;
    keys.left = false; keys.right = false;
    joystickKnobEl.style.transform = 'translate(-50%,-50%)';
  }

  joystickEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    joyPointerId = e.pointerId;
    joystickEl.setPointerCapture(e.pointerId);
    moveJoystick(e.clientX, e.clientY);
  });
  joystickEl.addEventListener('pointermove', e => {
    if (e.pointerId !== joyPointerId) return;
    moveJoystick(e.clientX, e.clientY);
  });
  joystickEl.addEventListener('pointerup', e => { if (e.pointerId === joyPointerId) resetJoystick(); });
  joystickEl.addEventListener('pointercancel', e => { if (e.pointerId === joyPointerId) resetJoystick(); });

  // 跳跃：单击立即触发一次（替代原来的长按轮询，响应更快）
  function doJump() {
    if (state !== 'play') return;
    if (cat.onGround) {
      cat.vy = CONFIG.jumpVel; cat.onGround = false; jumpCount = 1; playSound('jump');
    } else if (jumpCount < 2) {
      cat.vy = CONFIG.jumpVel * 0.85; jumpCount++; playSound('jump');
    }
  }

  const btnJumpEl = document.getElementById('btnJump');
  btnJumpEl.addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });
  btnJumpEl.addEventListener('contextmenu', e => e.preventDefault());

  document.getElementById('btnRestart').addEventListener('click', () => { resetGame(); paused = false; });
  document.getElementById('btnPause').addEventListener('click', () => { paused = !paused; });
  window.addEventListener('blur', () => { if (state === 'play') paused = true; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  const COLOR_BASE = { skyTop:[217,217,217], skyBottom:[143,143,143], groundTop:[90,90,90], groundBot:[43,43,43], ui:[255,255,255], accent:[187,187,187], wave:[255,255,255], sun:[255,255,255], cloud:[255,255,255] };
  const COLOR_RED  = { skyTop:[138,58,58], skyBottom:[74,18,18], groundTop:[58,20,20], groundBot:[26,8,8], ui:[255,106,106], accent:[204,68,68], wave:[255,90,90], sun:[255,110,90], cloud:[200,80,80] };
  let redT = 0;
  function lerpColor(a, b, t) { return [ Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t) ]; }
  function rgb(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }
  function rgba(c, a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function colorAt(key, t){ return lerpColor(COLOR_BASE[key], COLOR_RED[key], t); }

  const SCENERY = {
    early: ['一片草坪。','一台仿石音响在播放广场舞。','风吹过，什么也没发生。','远处有一台音响，正在播放天气预报。'],
    mid: ['同一片草坪，但音响多了一台。','风景里有一台音响正在看你。','你好像来过这里。','草坪上的石头，都在播放同一首歌。'],
    deep: ['风景是一台音响在看风景。','草坪上摆满了望景位，但没有猫。','太阳没有落，它只是变红了。','你听见自己在第 3 层叫过。'],
    meta: ['你确定这是第 N 层，还是第 1 层？','风景已记录。风景已记录。风景已记录。','猫坐下的时候，音响也在循环。','望景位在看你。']
  };
  function sceneryFor(layer) {
    let pool = SCENERY.early;
    if (layer > 3 && layer <= 6) pool = SCENERY.mid;
    else if (layer > 6 && layer <= 10) pool = SCENERY.deep;
    else if (layer > 10) pool = SCENERY.meta;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  let cat, san, time, state, camX;
  let layer = 1, layerWorldW = CONFIG.baseWorldW, layerSeat = null;
  let layerSpeakers = [], layerCovers = [], layerCoins = [], layerPlatforms = [];
  let currentScenery = '';
  let transition = { active: false, phase: 'none', t: 0, camFrom: 0, camTo: 0 };
  let currentSanDrain = 0, currentBullets = [], coinCount = 0;
  let stampObstacle = null, shakeMagnitude = 0;
  let jumpCount = 0; 
  
  let voidTimer = 0;
  let voidSpikes = [];

  let jumpscareActive = false, jumpscareTimer = 0;
  const jumpscareEl = document.getElementById('jumpscare');

  let bestLayer = parseInt(localStorage.getItem('cat_audio_best') || '1');
  let totalAssets = parseInt(localStorage.getItem('cat_audio_assets') || '0') || 0;
  const modal = document.getElementById('modal');
  const modalLayer = document.getElementById('modal-layer');
  const modalBest = document.getElementById('modal-best');
  const modalCoins = document.getElementById('modal-coins');

  const startScreenEl = document.getElementById('startScreen');
  const startBestEl = document.getElementById('start-best');
  const startAssetsEl = document.getElementById('start-assets');

  // 刷新启动界面的历史最高分与总资产
  function updateStartScreen() {
    startBestEl.textContent = '历史最高：第 ' + bestLayer + ' 层';
    startAssetsEl.textContent = '总资产：' + totalAssets;
  }

  // 把本局拾取的钱结算进总资产并清零本局计数
  function bankCoins() {
    if (coinCount > 0) {
      totalAssets += coinCount;
      localStorage.setItem('cat_audio_assets', totalAssets);
      coinCount = 0;
    }
  }

  updateStartScreen();
  state = 'waiting';
  resize();

  function resetGame() {
    bankCoins(); // 中途重开也把本局的钱记入总资产
    keys.left = false; keys.right = false; keys.jump = false;
    layer = 1; coinCount = 0; shakeMagnitude = 0; jumpCount = 0; voidTimer = 0; voidSpikes = [];
    generateLayer(layer);
    cat = { x: CONFIG.startX, y: 0, vx: 0, vy: 0, onGround: false, facing: 1, wobble: 0 };
    san = CONFIG.sanMax; 
    time = 0; state = 'play'; camX = 0;
    transition = { active:false, phase:'none', t:0, camFrom:0, camTo:0 };
    currentScenery = ''; currentBullets = []; stampObstacle = null;
    paused = false; modal.style.display = 'none'; jumpscareEl.style.display = 'none'; jumpscareActive = false;
  }

  function triggerGameOver() {
    state = 'gameover';
    if (layer > bestLayer) { bestLayer = layer; localStorage.setItem('cat_audio_best', bestLayer); }
    const earned = coinCount; // 本局拾取
    bankCoins();              // 结算进总资产并清零本局
    modalLayer.textContent = '你在第 ' + layer + ' 层循环失去了理智';
    modalBest.textContent = '历史最高：第 ' + bestLayer + ' 层';
    modalCoins.textContent = '本局拾取：' + earned + ' ｜ 总资产：' + totalAssets;
    modal.style.display = 'flex';
    playSound('hurt');
  }

  document.getElementById('btnModalRestart').addEventListener('click', resetGame);

  // 返回首页：隐藏失败弹窗，重新显示启动界面（同步最新最高分与总资产）
  function goHome() {
    modal.style.display = 'none';
    updateStartScreen();
    resetJoystick();
    startScreenEl.style.display = 'flex';
    startScreenEl.style.opacity = '1';
    state = 'waiting';
  }

  document.getElementById('btnModalHome').addEventListener('click', goHome);

  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    startScreenEl.style.opacity = '0';
    setTimeout(() => { startScreenEl.style.display = 'none'; resetGame(); }, 500);
  });

  function triggerJumpscare() {
    if (jumpscareActive) return;
    jumpscareActive = true; jumpscareTimer = 0.8; jumpscareEl.style.display = 'flex';
    san = Math.max(0, san - 15); shakeMagnitude = 20; playSound('jumpscare');
  }

  function randRange(a, b){ return a + Math.random() * (b - a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // ===================== 关卡生成（连续起伏 + 悬崖 + 浮空岛） =====================
  function generateLayer(n) {
    const len = CONFIG.baseWorldW + (n-1) * CONFIG.worldWInc;
    layerWorldW = len;
    redT = Math.min(1, (n-1) / 12);

    const baseGroundY = logicalH * 0.82;
    const safeStart = Math.max(100, 200 - n * 10);
    const safeEnd = safeStart; // 首尾安全区等宽
    const playableLen = len - safeStart - safeEnd;

    const diff = 1.0 + (n - 1) * 0.15;

    // 障碍物总量：可玩区按 spacing 均分，层数越高越密集
    const spacing = Math.max(120, 300 - (n - 1) * 15);
    const total = clamp(Math.floor(playableLen / spacing), 1, 25);

    // 墙（空中声源）与石头（地面脉冲）按随机比例分配，保持总数守恒
    const wallRatio = 0.5 + Math.random() * 0.2; // 0.5 ~ 0.7
    const wallCount = clamp(Math.round(total * wallRatio), 1, total);
    const stoneCount = total - wallCount;

    const coverCount = Math.max(1, Math.floor(total * 0.4));

    // 望景位位置
    layerSeat = { x: len - 110, y: baseGroundY - 60, w: 70, h: 60 };
    // 望景位安全区（左右各留出 150 像素）
    const seatSafeMin = layerSeat.x - 150;
    const seatSafeMax = layerSeat.x + layerSeat.w + 150;

    // 1. 生成连续起伏的地形折线（带断层）
    layerPlatforms = [];
    let currentX = safeStart;
    let currentY = baseGroundY;
    layerPlatforms.push({ x: -100, w: safeStart + 100, y: currentY, isFloat: false });

    while (currentX < len - safeEnd) {
      const stepX = randRange(150, 300);
      const stepY = randRange(-60, 60);
      let nextY = clamp(currentY + stepY, logicalH * 0.5, baseGroundY);
      
      if (Math.random() < 0.3) nextY = currentY;

      currentX += stepX;
      layerPlatforms.push({ x: currentX - stepX, w: stepX, y: currentY, isFloat: false });

      // 悬崖
      if (Math.random() < 0.4 && currentX < len - safeEnd - 200) {
        const gap = randRange(100, 220); 
        currentX += gap;
      }
      
      currentY = nextY;
    }
    
    // 确保终点有平坦的地面
    layerPlatforms.push({ x: len - safeEnd - 200, w: safeEnd + 400, y: baseGroundY, isFloat: false });

    // 2. 生成浮空岛 (严格限制在地面上方)
    const floatCount = Math.max(3, Math.floor(playableLen / 300));
    for (let i = 0; i < floatCount; i++) {
      let tries = 0, fx = 0, ok = false;
      const fw = randRange(80, 160);
      while (tries++ < 80) {
        fx = randRange(safeStart + 100, len - safeEnd - 200);
        // 浮空岛高度在基准地面 - 150 到 - 300 之间
        const fy = baseGroundY - randRange(150, 300);
        
        // 确保不和任何地面平台或已有浮空岛重叠
        let overlap = false;
        for (const p of layerPlatforms) {
          if (fx + fw > p.x - 40 && fx < p.x + p.w + 40 && Math.abs(fy - p.y) < 80) {
            overlap = true; break;
          }
        }
        if (!overlap) { 
          layerPlatforms.push({ x: fx, w: fw, y: fy, isFloat: true });
          ok = true; 
          break; 
        }
      }
    }

    // 强制望景位区域为平坦地面，避免座位悬空或埋入起伏地形
    const seatPadMin = layerSeat.x - 200;
    const seatPadMax = layerSeat.x + layerSeat.w + 120;
    for (const p of layerPlatforms) {
      if (!p.isFloat && p.x + p.w > seatPadMin && p.x < seatPadMax) p.y = baseGroundY;
    }
    layerPlatforms.push({ x: seatPadMin, w: seatPadMax - seatPadMin, y: baseGroundY, isFloat: false });
    layerSeat.y = baseGroundY - layerSeat.h; // 座位坐落在实际地面上

    layerSpeakers = [];
    layerCovers = [];
    layerCoins = [];
    currentBullets = [];
    stampObstacle = null;

    function getPlatformAt(x) {
      for (const p of layerPlatforms) {
        if (x >= p.x && x <= p.x + p.w) return p;
      }
      return null; 
    }

    const minGap = Math.max(40, 120 - (n - 1) * 8);
    
    // 3. 掩体（排除望景位安全区）
    for (let i = 0; i < coverCount; i++) {
      let tries = 0, x = 0, ok = false;
      const w = 80 + Math.random() * 40;
      while (tries++ < 80) {
        x = randRange(safeStart + 50, len - safeEnd - 150);
        // 排除望景位附近
        if (x + w > seatSafeMin && x < seatSafeMax) continue;

        const p1 = getPlatformAt(x);
        const p2 = getPlatformAt(x + w);
        
        if (!p1 || p1 !== p2 || p1.isFloat) continue;
        if (x < p1.x + 40 || x + w > p1.x + p1.w - 40) continue;
        
        let overlap = false;
        for (const c of layerCovers) {
          if (x + w > c.x - 60 && x < c.x + c.w + 60) { overlap = true; break; }
        }
        if (!overlap) { ok = true; break; }
      }
      if (!ok) continue;
      const p = getPlatformAt(x + w/2);
      layerCovers.push({ x, w, h: CONFIG.coverH, y: p.y - CONFIG.coverH, broken: false });
    }
    layerCovers.sort((a, b) => a.x - b.x);

    function isValidPos(x, r) {
      if (x - r < safeStart) return false;
      if (x + r > len - safeEnd) return false;
      // 排除望景位附近
      if (x + r > seatSafeMin && x - r < seatSafeMax) return false;
      
      for (const c of layerCovers) {
        if (x + r > c.x - 20 && x - r < c.x + c.w + 20) return false;
      }
      for (const s of layerSpeakers) { if (Math.abs(s.x - x) < minGap) return false; }
      return true;
    }

    // 4. 墙上音响
    for (let i = 0; i < wallCount; i++) {
      let tries = 0, x = 0, ok = false;
      const r = 120 + diff * 15;
      const period = Math.max(1.6, 3.5 - diff * 0.25);
      while (tries++ < 80) { 
        x = randRange(safeStart, len - safeEnd); 
        if (isValidPos(x, r * 0.5)) { ok = true; break; } 
      }
      if (!ok) continue;
      layerSpeakers.push({ type: 'wall', x, y: 140, r, period, phase: Math.random() * period, timer: Math.random() * period, w: CONFIG.wallW, h: CONFIG.wallH });
    }

    // 5. 地上音响
    for (let i = 0; i < stoneCount; i++) {
      let tries = 0, x = 0, ok = false;
      const r = 100 + diff * 12;
      while (tries++ < 80) { 
        x = randRange(safeStart, len - safeEnd); 
        const p = getPlatformAt(x);
        if (!p || x < p.x + 30 || x > p.x + p.w - 30) continue; 

        if (isValidPos(x, r * 0.5)) { ok = true; break; } 
      }
      if (!ok) continue;
      const p = getPlatformAt(x);
      layerSpeakers.push({ 
        type: 'stone', x, y: p.y - 32, r, phase: Math.random() * Math.PI * 2,
        w: CONFIG.stoneW, h: CONFIG.stoneH, groundY: p.y, 
        pulseTimer: Math.random() * CONFIG.stonePulsePeriod, pulseActive: false, pulseLife: 0, pulseR: 0, pulseAlpha: 0
      });
    }

    // 6. 金币（排除望景位安全区）
    const coinCountGen = Math.floor(total * 0.6) + 1;
    for (let i = 0; i < coinCountGen; i++) {
      let tries = 0, x = 0, ok = false;
      while (tries++ < 80) {
        x = randRange(safeStart + 50, len - safeEnd - 50);
        // 排除望景位附近
        if (x > seatSafeMin && x < seatSafeMax) continue;

        let overlap = false;
        for (const c of layerCovers) { if (x > c.x - 40 && x < c.x + c.w + 40) { overlap = true; break; } }
        for (const s of layerSpeakers) { if (Math.abs(x - s.x) < 60) { overlap = true; break; } }
        if (!overlap) { ok = true; break; }
      }
      if (!ok) continue;
      const p = getPlatformAt(x);
      const groundY = p ? p.y : baseGroundY;
      const yOffset = p && p.isFloat ? 40 : (Math.random() < 0.3 ? randRange(160, 240) : randRange(60, 120));
      layerCoins.push({ x, y: groundY - yOffset, collected: false });
    }

    layerSpeakers.sort((a, b) => a.x - b.x);
    // 基础流失：前 2 层为 0（熟悉操作），之后平滑递增并封顶
    currentSanDrain = Math.min(2.5, Math.max(0, (n - 2) * 0.2));
  }

  // ===================== 碰撞与判定 =====================
  function inCircle(px, py, cx, cy, r){ return (px-cx)**2 + (py-cy)**2 <= r*r; }

  function getActiveHitboxes() {
    const hitboxes = [];
    for (const s of layerSpeakers) {
      if (s.type === 'stone' && s.pulseActive) hitboxes.push({ cx: s.x, cy: s.y, r: s.pulseR, type: 'pulse', alpha: s.pulseAlpha });
    }
    return hitboxes;
  }

  function getCollisionBoxes() {
    const boxes = [];
    for (const p of layerPlatforms) {
      boxes.push({ x: p.x, y: p.y, w: p.w, h: logicalH - p.y, isPlatform: true });
    }
    for (const c of layerCovers) { if (!c.broken) boxes.push({ x: c.x, y: c.y, w: c.w, h: c.h, isCover: true, ref: c }); }
    for (const s of layerSpeakers) {
      boxes.push({ x: s.x - s.w/2, y: s.y - s.h/2, w: s.w, h: s.h, isCover: false });
    }
    return boxes;
  }

  function update(dt) {
    if (state === 'waiting' || state === 'gameover' || paused) return;
    if (state === 'transition') { updateTransition(dt); return; }
    
    if (jumpscareActive) {
      jumpscareTimer -= dt;
      if (jumpscareTimer <= 0) { jumpscareActive = false; jumpscareEl.style.display = 'none'; }
      return; 
    }

    if (shakeMagnitude > 0) { shakeMagnitude -= dt * 50; if (shakeMagnitude < 0) shakeMagnitude = 0; }
    time += dt;

    // 红色印章
    if (layer >= 5) {
      if (!stampObstacle) {
        if (Math.random() < 0.15 * dt * 60) {
          const fallX = clamp(cat.x + randRange(-100, 100), 50, layerWorldW - 100);
          let targetGy = logicalH;
          for (const p of layerPlatforms) { if (fallX >= p.x && fallX <= p.x + p.w && !p.isFloat) { targetGy = p.y; break; } }
          stampObstacle = { x: fallX, w: 80, timer: CONFIG.stampWarnTime, state: 'warn', y: -100, targetY: targetGy };
        }
      } else {
        stampObstacle.timer -= dt;
        if (stampObstacle.state === 'warn') {
          if (stampObstacle.timer <= 0) { stampObstacle.state = 'drop'; stampObstacle.y = -100; }
        } else if (stampObstacle.state === 'drop') {
          stampObstacle.y += 3000 * dt; 
          if (stampObstacle.y >= stampObstacle.targetY - 80) {
            stampObstacle.y = stampObstacle.targetY - 80; stampObstacle.state = 'impact'; stampObstacle.timer = 0.5; playSound('stamp');
            if (cat.x + CONFIG.catW > stampObstacle.x && cat.x < stampObstacle.x + stampObstacle.w && cat.y + CONFIG.catH > stampObstacle.targetY - 80) { san -= CONFIG.stampDamage; shakeMagnitude = 15; }
          }
        } else if (stampObstacle.state === 'impact') {
          if (stampObstacle.timer <= 0) stampObstacle = null; 
        }
      }
    }

    // 深渊凝视逻辑
    let onPlatform = false;
    for (const p of layerPlatforms) {
      if (cat.x + CONFIG.catW > p.x + 10 && cat.x < p.x + p.w - 10 && Math.abs(cat.y + CONFIG.catH - p.y) < 20) { onPlatform = true; break; }
    }
    if (!onPlatform && !cat.onGround) {
      voidTimer += dt;
      if (voidTimer > 0.8) { 
        san -= 50 * dt; 
        if (Math.random() < 0.2) {
           voidSpikes.push({ x: cat.x, y: logicalH, h: 150, life: 0.5 });
        }
        shakeMagnitude = Math.max(shakeMagnitude, 5);
      }
    } else {
      voidTimer = 0;
    }
    
    for (let i = voidSpikes.length - 1; i >= 0; i--) {
      voidSpikes[i].life -= dt;
      if (voidSpikes[i].life <= 0) voidSpikes.splice(i, 1);
    }

    let ax = 0;
    if (keys.left) ax -= 1;
    if (keys.right) ax += 1;
    if (ax !== 0) cat.facing = ax;
    cat.vx = ax * CONFIG.catSpeed;
    
    let newX = cat.x + cat.vx * dt;
    const catH = CONFIG.catH, cw = CONFIG.catW;
    const colliders = getCollisionBoxes();

    // 水平碰撞
    for (const box of colliders) {
      if (!box.isPlatform && newX + cw > box.x && newX < box.x + box.w &&
          cat.y + catH > box.y && cat.y < box.y + box.h) {
        if (cat.vx > 0) newX = box.x - cw;
        if (cat.vx < 0) newX = box.x + box.w;
      }
    }
    cat.x = newX;

    // 跳跃由键盘/触摸单击事件触发（doJump），此处不再轮询 keys.jump

    cat.vy += CONFIG.gravity * dt;
    cat.y += cat.vy * dt;

    cat.onGround = false;
    for (const box of colliders) {
      if (cat.x + cw > box.x && cat.x < box.x + box.w &&
          cat.vy > 0 && cat.y + catH > box.y && cat.y + catH < box.y + Math.max(30, cat.vy * dt)) {
        cat.y = box.y - catH;
        cat.vy = 0;
        cat.onGround = true;
        jumpCount = 0; 
        break;
      }
    }

    if (cat.y > logicalH + 100) {
      san -= 20; shakeMagnitude = 20;
      if (san <= 0) { triggerGameOver(); return; }
      // 掉坑后回到最近的地面平台，而不是整关重来
      let bestP = null, bestDist = Infinity;
      for (const p of layerPlatforms) {
        if (p.isFloat) continue;
        const px = clamp(cat.x, p.x + 40, p.x + p.w - 40);
        const d = Math.abs(px - cat.x);
        if (d < bestDist) { bestDist = d; bestP = p; }
      }
      if (bestP) { cat.x = clamp(cat.x, bestP.x + 40, bestP.x + bestP.w - 40); cat.y = bestP.y - catH; }
      else { cat.x = CONFIG.startX; cat.y = -100; }
      cat.vy = 0; jumpCount = 0;
    }

    cat.x = clamp(cat.x, 0, layerWorldW - cw);
    if (ax !== 0 && cat.onGround) cat.wobble = Math.sin(time * 14) * 0.1; else cat.wobble = 0;

    const followTarget = clamp(cat.x - logicalW * 0.35, 0, layerWorldW - logicalW);
    camX += (followTarget - camX) * Math.min(1, dt * 6);

    const catCenterX = cat.x + cw / 2, catCenterY = cat.y + catH / 2;
    
    for (const c of layerCoins) {
      if (c.collected) continue;
      if (catCenterX + 20 > c.x && catCenterX - 20 < c.x && catCenterY + 20 > c.y && catCenterY - 20 < c.y) { c.collected = true; coinCount += 1; playSound('coin'); }
    }

    // 子弹追踪玩家
    for (let i = currentBullets.length - 1; i >= 0; i--) {
      const b = currentBullets[i]; 
      b.age += dt; 
      
      const dx = catCenterX - b.x;
      const dy = catCenterY - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const speed = CONFIG.bulletSpeed;
      
      b.vx += (dx / dist) * 100 * dt;
      b.vy += (dy / dist) * 100 * dt;
      
      const currentSpeed = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
      if (currentSpeed > speed) {
        b.vx = (b.vx / currentSpeed) * speed;
        b.vy = (b.vy / currentSpeed) * speed;
      }

      b.x += b.vx * dt; b.y += b.vy * dt;
      
      if (inCircle(catCenterX, catCenterY, b.x, b.y, b.r + cw / 2.5)) { san -= CONFIG.bulletExplodeDamage; shakeMagnitude = 12; currentBullets.splice(i, 1); continue; }
      if (b.age > b.maxAge || b.x < -100 || b.x > layerWorldW + 100) currentBullets.splice(i, 1);
    }
    
    for (const s of layerSpeakers) {
      if (s.type === 'wall') {
        s.timer -= dt;
        if (s.timer <= 0) {
          s.timer = s.period; 
          const dx = catCenterX - s.x, dy = catCenterY - s.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1, speed = CONFIG.bulletSpeed;
          currentBullets.push({ x: s.x, y: s.y, vx: (dx / dist) * speed, vy: (dy / dist) * speed, r: CONFIG.bulletRadius, age: 0, maxAge: 3.0 });
        }
      }
    }

    for (const s of layerSpeakers) {
      if (s.type === 'stone') {
        s.pulseTimer -= dt;
        if (s.pulseActive) {
          s.pulseLife += dt; s.pulseR = s.r * (s.pulseLife / CONFIG.stonePulseDuration); s.pulseAlpha = Math.max(0, 1 - s.pulseLife / CONFIG.stonePulseDuration);
          if (s.pulseLife >= CONFIG.stonePulseDuration) { s.pulseActive = false; s.pulseR = 0; s.pulseAlpha = 0; }
        } else {
          if (s.pulseTimer <= 0) { s.pulseActive = true; s.pulseTimer = CONFIG.stonePulsePeriod; s.pulseLife = 0; s.pulseR = 0; s.pulseAlpha = 1; }
        }
      }
    }

    let inNoise = false;
    for (const h of getActiveHitboxes()) { if (inCircle(catCenterX, catCenterY, h.cx, h.cy, h.r)) { inNoise = true; break; } }
    
    if (inNoise) { 
      san -= CONFIG.sanDamage * dt; 
      if (Math.random() < 0.1) { playSound('hurt'); shakeMagnitude = 6; } 
    } else { 
      // 不在噪音中恢复 SAN；靠近掩体时恢复更快（掩体是安全点）
      let nearCover = false;
      for(const c of layerCovers) {
        if (Math.abs((cat.x + cw/2) - (c.x + c.w/2)) < 100) { nearCover = true; break; }
      }
      san += CONFIG.sanRecover * (nearCover ? 1.8 : 1) * dt; 
    }
    san -= currentSanDrain * dt;
    san = clamp(san, 0, CONFIG.sanMax);

    if (san <= 0) { triggerGameOver(); return; }

    const vs = layerSeat;
    if (cat.x + cw > vs.x && cat.x < vs.x + vs.w && cat.y + catH > vs.y && cat.y < vs.y + vs.h) startTransition();
  }

  function startTransition() {
    state = 'transition'; currentScenery = sceneryFor(layer);
    transition = { active: true, phase: 'camera', t: 0, camFrom: camX, camTo: clamp(layerSeat.x - logicalW * 0.5, 0, layerWorldW - logicalW) };
  }

  function updateTransition(dt) {
    time += dt; transition.t += dt;
    if (transition.phase === 'camera') {
      const k = Math.min(1, transition.t / 0.9), e = 1 - Math.pow(1-k, 3);
      camX = transition.camFrom + (transition.camTo - transition.camFrom) * e;
      if (k >= 1) { transition.phase = 'sunset'; transition.t = 0; }
    } else if (transition.phase === 'sunset') {
      if (transition.t >= 3.2) { transition.phase = 'blackout'; transition.t = 0; }
    } else if (transition.phase === 'blackout') {
      if (transition.t >= 1.4) {
        layer++; generateLayer(layer);
        cat = { x: CONFIG.startX, y: -100, vx: 0, vy: 0, onGround: false, facing: 1, wobble: 0 };
        san = CONFIG.sanMax; camX = 0; time = 0;
        transition = { active:false, phase:'none', t:0, camFrom:0, camTo:0 };
        state = 'play';
      }
    }
  }

  function drawNoise() { ctx.save(); ctx.fillStyle = `rgba(0, 0, 0, ${0.05 + redT * 0.15})`; ctx.fillRect(0, 0, logicalW, logicalH); ctx.restore(); }
  function sx(x) { return x - camX; }

  function drawSkyGround() {
    const g = ctx.createLinearGradient(0,0,0,logicalH * 0.82);
    g.addColorStop(0, rgb(colorAt('skyTop', redT)));
    g.addColorStop(1, rgb(colorAt('skyBottom', redT)));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,logicalW,logicalH * 0.82);

    const mountainCount = Math.max(2, 6 - Math.floor(redT * 4));
    ctx.fillStyle = rgba(lerpColor([120,120,120], [150,60,60], redT), 0.35 + redT * 0.15);
    for (let i=0;i<mountainCount;i++){
      const bx = ((i*420 - camX*0.3) % (logicalW + 600)) - 300;
      ctx.beginPath(); ctx.moveTo(bx, logicalH * 0.82); ctx.lineTo(bx+180, logicalH * 0.82-140); ctx.lineTo(bx+360, logicalH * 0.82); ctx.closePath(); ctx.fill();
    }
  }

  // 绘制连续起伏的地形和浮空岛
  function drawPlatforms() {
    const gt = colorAt('groundTop', redT), gb = colorAt('groundBot', redT);
    for (const p of layerPlatforms) {
      const x = sx(p.x);
      if (x + p.w < -100 || x > logicalW + 100) continue;
      
      if (p.isFloat) {
        // 浮空岛：倒梯形
        ctx.fillStyle = rgb(gt);
        ctx.beginPath();
        ctx.moveTo(x, p.y);
        ctx.lineTo(x + p.w, p.y);
        ctx.lineTo(x + p.w - 20, p.y + 30);
        ctx.lineTo(x + 20, p.y + 30);
        ctx.closePath();
        ctx.fill();

        // 底部阴影
        ctx.fillStyle = rgba(gb, 0.5);
        ctx.beginPath();
        ctx.moveTo(x + 20, p.y + 30);
        ctx.lineTo(x + p.w - 20, p.y + 30);
        ctx.lineTo(x + p.w / 2, p.y + 50);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.2)'; 
        ctx.fillRect(x, p.y, p.w, 4);
      } else {
        // 地面
        const g = ctx.createLinearGradient(0, p.y, 0, logicalH);
        g.addColorStop(0, rgb(gt)); g.addColorStop(1, rgb(gb));
        ctx.fillStyle = g; ctx.fillRect(x, p.y, p.w, logicalH - p.y);
        ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(x, p.y, p.w, 4);
      }
    }
  }

  function drawVoidSpikes() {
    for (const s of voidSpikes) {
      const x = sx(s.x);
      if (x < -100 || x > logicalW + 100) continue;
      const alpha = s.life / 0.5;
      ctx.fillStyle = `rgba(80, 0, 0, ${alpha})`;
      ctx.beginPath();
      ctx.moveTo(x, logicalH);
      ctx.lineTo(x + 20, logicalH - s.h);
      ctx.lineTo(x + 40, logicalH);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawCovers() {
    for (const c of layerCovers) {
      const x = sx(c.x);
      if (x + c.w < -100 || x > logicalW + 100) continue;
      if (c.broken) {
        ctx.fillStyle = '#5a5a5a'; ctx.beginPath(); ctx.arc(x + c.w/3, c.y + c.h - 10, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#4a4a4a'; ctx.beginPath(); ctx.arc(x + c.w*0.7, c.y + c.h - 6, 6, 0, Math.PI*2); ctx.fill(); continue;
      }
      const centerX = x + c.w/2, centerY = c.y + c.h/2, radius = c.w / 2;
      ctx.fillStyle = '#6a6a6a'; ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI*2); ctx.fill();
      const grad = ctx.createRadialGradient(centerX - radius*0.3, centerY - radius*0.3, radius*0.1, centerX, centerY, radius);
      grad.addColorStop(0, 'rgba(255,255,255,0.2)'); grad.addColorStop(0.6, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.4)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawCoins() {
    for (const c of layerCoins) {
      if (c.collected) continue;
      const x = sx(c.x);
      if (x < -50 || x > logicalW + 50) continue;
      if (images.coin) ctx.drawImage(images.coin, x - 16, c.y - 16, 32, 32);
      else {
        ctx.save(); ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(x, c.y, 16, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#d4ac0d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, c.y, 12, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#d4ac0d'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', x, c.y + 1);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.restore();
      }
      const glow = 0.5 + Math.sin(time * 5 + c.x) * 0.5;
      ctx.fillStyle = `rgba(241, 196, 15, ${glow * 0.2})`; ctx.beginPath(); ctx.arc(x, c.y, 24, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawSpeaker(s) {
    const x = sx(s.x);
    if (x < -160 || x > logicalW + 160) return;
    
    if (s.type === 'wall') {
      ctx.fillStyle = '#b0b0b0'; ctx.beginPath(); ctx.moveTo(x - 20, s.y - 30); ctx.lineTo(x + 20, s.y - 30); ctx.lineTo(x + 25, s.y + 30); ctx.lineTo(x - 15, s.y + 30); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.moveTo(x - 25, s.y - 35); ctx.lineTo(x + 15, s.y - 35); ctx.lineTo(x + 20, s.y + 25); ctx.lineTo(x - 20, s.y + 25); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#666'; ctx.beginPath(); ctx.moveTo(x - 15, s.y - 25); ctx.lineTo(x + 8, s.y - 25); ctx.lineTo(x + 12, s.y + 15); ctx.lineTo(x - 11, s.y + 15); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f0f0f0'; ctx.beginPath(); ctx.ellipse(x - 5, s.y - 30, 10, 6, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(x - 5, s.y - 30, 5, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - 5, s.y - 35); ctx.lineTo(x - 5, 0); ctx.stroke();
    } else {
      const w = s.w, h = s.h;
      const cx = x, cy = s.groundY; 
      ctx.fillStyle = '#72756c'; ctx.beginPath(); ctx.moveTo(cx - w*0.48, cy); ctx.lineTo(cx - w*0.52, cy - h*0.35); ctx.lineTo(cx - w*0.3, cy - h*0.9); ctx.lineTo(cx + w*0.15, cy - h*0.98); ctx.lineTo(cx + w*0.4, cy - h*0.7); ctx.lineTo(cx + w*0.5, cy - h*0.2); ctx.lineTo(cx + w*0.45, cy); ctx.closePath(); ctx.fill();
      const grad = ctx.createLinearGradient(cx, cy - h, cx, cy); grad.addColorStop(0, 'rgba(255,255,255,0.15)'); grad.addColorStop(1, 'rgba(0,0,0,0.5)'); ctx.fillStyle = grad; ctx.fill();
      const holes = [{x: -0.1, y: -0.6, s: 1.2}, {x: 0.05, y: -0.55, s: 1}, {x: -0.2, y: -0.45, s: 0.8}, {x: -0.05, y: -0.4, s: 1.1}, {x: 0.1, y: -0.35, s: 0.9}, {x: -0.25, y: -0.3, s: 0.7}, {x: -0.15, y: -0.2, s: 1}, {x: 0, y: -0.15, s: 0.8}, {x: 0.15, y: -0.2, s: 1.1}, {x: 0.25, y: -0.35, s: 0.6}];
      ctx.fillStyle = '#1c1c1c'; for (const hole of holes) { const holeX = cx + hole.x * w; const holeY = cy + hole.y * h; ctx.beginPath(); const hs = 4 * hole.s; ctx.moveTo(holeX - hs, holeY); ctx.lineTo(holeX - hs*0.5, holeY - hs); ctx.lineTo(holeX + hs*0.5, holeY - hs*0.8); ctx.lineTo(holeX + hs, holeY); ctx.lineTo(holeX + hs*0.6, holeY + hs*0.8); ctx.lineTo(holeX - hs*0.6, holeY + hs); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = 'rgba(100, 130, 80, 0.4)'; ctx.beginPath(); ctx.ellipse(cx - w*0.35, cy - h*0.15, 12, 8, 0.5, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawStampObstacle() {
    if (!stampObstacle) return;
    const x = sx(stampObstacle.x);
    if (x + stampObstacle.w < -100 || x > logicalW + 100) return;
    if (stampObstacle.state === 'warn') {
      ctx.save(); ctx.strokeStyle = `rgba(255, 50, 50, ${0.5 + Math.sin(time * 20) * 0.5})`; ctx.lineWidth = 4; ctx.setLineDash([10, 10]); ctx.strokeRect(x, stampObstacle.targetY - 10, stampObstacle.w, 10);
    } else if (stampObstacle.state === 'drop') {
      ctx.save(); const dropY = stampObstacle.y; ctx.fillStyle = '#cc2222'; ctx.beginPath(); ctx.rect(x + stampObstacle.w*0.3, dropY - 60, stampObstacle.w*0.4, 40); ctx.rect(x, dropY, stampObstacle.w, 80); ctx.fill();
      ctx.fillStyle = '#ff4444'; ctx.fillRect(x, dropY + 70, stampObstacle.w, 10); ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x + 5, dropY + 5, stampObstacle.w - 10, 10); ctx.restore();
    } else if (stampObstacle.state === 'impact') {
      ctx.save(); const alpha = stampObstacle.timer / 0.5; ctx.fillStyle = `rgba(200, 20, 20, ${alpha * 0.6})`; ctx.beginPath(); ctx.ellipse(x + stampObstacle.w/2, stampObstacle.targetY - 10, stampObstacle.w/2 + (1 - alpha) * 100, 30 + (1-alpha)*30, 0, 0, Math.PI*2); ctx.fill();
      for(let i=0; i<8; i++){ const px = x + stampObstacle.w/2 + randRange(-60, 60); const py = stampObstacle.targetY - 10 - randRange(0, 80) * alpha; ctx.fillStyle = `rgba(200, 20, 20, ${alpha})`; ctx.beginPath(); ctx.arc(px, py, randRange(2,6), 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle = `rgba(150, 10, 10, ${alpha * 0.3})`; ctx.fillRect(x, stampObstacle.targetY - 10, stampObstacle.w, 10); ctx.restore();
    }
  }

  function drawHitboxes() {
    const wc = colorAt('wave', redT);
    for (const b of currentBullets) { const x = sx(b.x); if (x + b.r < 0 || x - b.r > logicalW) continue; ctx.save(); ctx.fillStyle = rgba(wc, 0.2); ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = rgba(wc, 0.8); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, Math.PI*2); ctx.stroke(); ctx.restore(); }
    for (const s of layerSpeakers) { if (s.type === 'stone' && s.pulseActive) { const x = sx(s.x); if (x + s.pulseR < 0 || x - s.pulseR > logicalW) continue; ctx.save(); ctx.strokeStyle = rgba(wc, 0.5 * s.pulseAlpha); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, s.y, s.pulseR, 0, Math.PI*2); ctx.stroke(); ctx.restore(); } }
  }

  function drawSeatBase(x, y, w, fill, stroke) {
    ctx.fillStyle = fill; ctx.fillRect(x, y+30, w, 10); ctx.fillRect(x+6, y+40, 6, 20); ctx.fillRect(x+w-12, y+40, 6, 20); ctx.fillRect(x, y, 10, 40);
    ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x-10, y+10); ctx.lineTo(x+w+10, y+10); ctx.stroke();
  }

  function drawViewSeat() {
    const v = layerSeat, x = sx(v.x);
    if (x + v.w < -100 || x > logicalW + 100) return;
    drawSeatBase(x, v.y, v.w, '#4a4a4a', rgb(colorAt('accent', redT)));
    ctx.fillStyle = rgba(colorAt('ui', redT), 0.6); ctx.font = '12px system-ui'; ctx.fillText('望景位', x+4, v.y-12);
  }

  function drawCat() {
    const cw = CONFIG.catW, ch = CONFIG.catH, baseX = sx(cat.x);
    ctx.save(); const cx = baseX + cw/2, footY = cat.y + ch; ctx.translate(cx, footY); ctx.rotate(cat.wobble); ctx.translate(-cw/2, -ch);
    if (images.cat) ctx.drawImage(images.cat, 0, 0, cw, ch);
    else {
      ctx.fillStyle = '#111'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cw/2, ch*0.62, cw*0.3, ch*0.3, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(cw*0.65, ch*0.35, ch*0.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cw*0.55, ch*0.25); ctx.lineTo(cw*0.6, ch*0.05); ctx.lineTo(cw*0.7, ch*0.25); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cw*0.7, ch*0.35, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawHUD() {
    const uiC = colorAt('ui', redT);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(20, 16, 150, 26); ctx.fillStyle = rgb(uiC); ctx.font = '14px system-ui'; ctx.fillText('第 ' + layer + ' 层循环', 30, 34);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(logicalW - 120, 16, 100, 26); ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'right'; ctx.fillText('💰 ' + coinCount, logicalW - 30, 35); ctx.textAlign = 'left';
    const x = 20, y = 56, w = 220, h = 16;
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x, y, w, h);
    const p = san / CONFIG.sanMax; const barColor = lerpColor([220,50,50], [255,255,255], Math.pow(p, 2)); ctx.fillStyle = rgb(barColor); ctx.fillRect(x, y, w * p, h);
    ctx.strokeStyle = rgb(uiC); ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); ctx.fillStyle = rgb(uiC); ctx.font = '12px system-ui'; ctx.fillText('SAN 值', x, y-5);
    if (currentSanDrain > 0) { ctx.fillStyle = rgba([255,80,80], 0.7 + Math.sin(time * 5) * 0.3); ctx.font = '11px system-ui'; ctx.fillText('SAN 正在流失', x + w + 10, y + 13); }
    if (san < 30) { const pulse = (Math.sin(time * 10) * 0.5 + 0.5) * 0.3; ctx.fillStyle = `rgba(255, 0, 0, ${pulse})`; ctx.fillRect(0, 0, logicalW, logicalH); }
  }

  function drawPauseOverlay() {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, logicalW, logicalH);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '28px system-ui'; ctx.fillText('已暂停 · 按 P 或点「暂停」继续', logicalW / 2, logicalH / 2); ctx.textAlign = 'left';
  }

  function drawTransition() {
    const v = layerSeat, seatScreenX = v.x - camX;
    const sunsetT = transition.phase === 'sunset' ? Math.min(1, transition.t / 3.2) : (transition.phase === 'blackout' ? 1 : 0);
    const g = ctx.createLinearGradient(0,0,0,logicalH); g.addColorStop(0, rgb(lerpColor(colorAt('skyTop', redT), [30,10,10], sunsetT))); g.addColorStop(0.6, rgb(lerpColor(colorAt('skyBottom', redT), [160,50,40], sunsetT))); g.addColorStop(1, '#111'); ctx.fillStyle = g; ctx.fillRect(0,0,logicalW,logicalH);
    if (transition.phase !== 'camera') { const sunY = logicalH*0.62 - sunsetT * 120; ctx.fillStyle = rgba(colorAt('sun', redT), 0.85); ctx.beginPath(); ctx.arc(logicalW/2, sunY, 70, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = rgba(colorAt('cloud', redT), 0.22); for (let i=0;i<4;i++){ const cy = 120 + i*70 + Math.sin(time+i)*10; const cx = logicalW/2 - 270 + i*180; ctx.beginPath(); ctx.ellipse(cx, cy, 80, 22, 0, 0, Math.PI*2); ctx.fill(); } }
    if (transition.phase === 'camera') { const vx = seatScreenX; drawSeatBase(vx, v.y, v.w, '#3a3a3a', '#666'); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(vx+v.w/2, v.y+16, 26, 30, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(vx+v.w/2+12, v.y-6, 14, 0, Math.PI*2); ctx.fill(); }
    drawNoise();
    if (transition.phase === 'sunset' && transition.t > 1.2) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(logicalW/2-240, logicalH-120, 480, 70); ctx.fillStyle = rgb(colorAt('ui', redT)); ctx.textAlign = 'center'; ctx.font = '18px system-ui'; ctx.fillText(currentScenery, logicalW/2, logicalH-80); ctx.textAlign = 'left'; }
    if (transition.phase === 'blackout') { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, transition.t / 0.6)})`; ctx.fillRect(0,0,logicalW,logicalH); if (transition.t > 0.5) { ctx.fillStyle = rgb(colorAt('ui', redT)); ctx.textAlign = 'center'; ctx.font = '22px system-ui'; ctx.fillText('第 ' + layer + ' 层循环 · 风景已记录', logicalW/2, logicalH/2); ctx.font = '14px system-ui'; ctx.fillStyle = rgba(colorAt('ui', redT), 0.6); ctx.fillText('进入下一层…', logicalW/2, logicalH/2 + 34); ctx.textAlign = 'left'; } }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    try {
      if (!paused) update(dt);
      ctx.save();
      if (shakeMagnitude > 0) { const dx = randRange(-shakeMagnitude, shakeMagnitude); const dy = randRange(-shakeMagnitude, shakeMagnitude); ctx.translate(dx, dy); }
      if (state === 'play' || state === 'gameover' || state === 'waiting') {
        drawSkyGround(); drawPlatforms(); drawVoidSpikes(); drawCovers(); drawCoins(); drawStampObstacle(); for (const s of layerSpeakers) drawSpeaker(s); drawHitboxes(); drawViewSeat(); drawNoise();
        if(state !== 'waiting') drawCat(); drawHUD();
        if (paused) drawPauseOverlay();
      } else if (state === 'transition') { drawTransition(); }
      ctx.restore();
    } catch (err) { console.error("渲染错误:", err); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
